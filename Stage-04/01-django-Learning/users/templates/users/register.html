{% extends "core/base.html" %}
<!-- Load the crispy filter tags -->
{% load crispy_forms_tags %}

{% block content %}
    <div class="content-section">
        <!-- Must be POST when sending sensitive credentials -->
        <form method="POST">
            <!-- CSRF token creates the secret hidden input to prevent cross-site request attacks -->
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Join Today</legend>
                <!-- crispy filter automatically adds Bootstrap markup and validation error styling -->
                {{ form|crispy }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">Sign Up</button>
            </div>
        </form>
        <div class="border-top pt-3">
            <small class="text-muted">
                Already Have An Account? <a class="ml-2" href="{% url 'login' %}">Sign In</a>
            </small>
        </div>
    </div>
{% endblock content %}
